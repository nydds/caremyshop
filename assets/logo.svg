<svg xmlns="http://www.w3.org/2000/svg" width="360" height="96" viewBox="0 0 360 96" role="img" aria-label="CareMyShop logo">
  <title>CareMyShop</title>
  <desc>Storefront awning in deep navy and emerald with a checkmark — daily care for neighborhood shops.</desc>
  <!-- Storefront -->
  <g>
    <!-- Awning: alternating navy / emerald scalloped canopy -->
    <path d="M14 34 L66 34 L66 22 Q66 14 58 14 L22 14 Q14 14 14 22 Z" fill="#0F2942"/>
    <path d="M24 14 L28 34 L38 34 L34 14 Z" fill="#10B981"/>
    <path d="M46 14 L50 34 L60 34 L56 14 Z" fill="#10B981"/>
    <!-- Awning scallops -->
    <circle cx="19" cy="34" r="5" fill="#0F2942"/>
    <circle cx="33" cy="34" r="5" fill="#10B981"/>
    <circle cx="47" cy="34" r="5" fill="#0F2942"/>
    <circle cx="61" cy="34" r="5" fill="#10B981"/>
    <!-- Shop body -->
    <rect x="18" y="40" width="44" height="30" rx="3" fill="#F8FAFC" stroke="#0F2942" stroke-width="2.5"/>
    <!-- Door + window -->
    <rect x="24" y="50" width="12" height="20" rx="1.5" fill="#0F2942"/>
    <rect x="42" y="50" width="14" height="12" rx="1.5" fill="#10B981" opacity="0.85"/>
    <!-- Checkmark badge -->
    <circle cx="66" cy="62" r="13" fill="#10B981" stroke="#F8FAFC" stroke-width="2.5"/>
    <path d="M60.5 62 L64.5 66 L72 57.5" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Wordmark -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="92" y="46" font-size="30" font-weight="700" fill="#0F2942">Care<tspan fill="#10B981">My</tspan>Shop</text>
    <text x="93" y="68" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" letter-spacing="2.2" fill="#0F2942" opacity="0.72">DAILY ONLINE CARE</text>
  </g>
</svg>
